    <div id="cap1" class="clip cap" data-start="0.3" data-duration="2.7"><span id="cap1-t">This flower is his.</span></div>
    <div id="cap2" class="clip cap" data-start="3.4" data-duration="2.7"><span id="cap2-t">A rival? Flare the throat.</span></div>
    <div id="cap3" class="clip cap" data-start="6.4" data-duration="2.7"><span id="cap3-t">Then the plunge-dive.</span></div>
    <div id="cap4" class="clip cap" data-start="9.4" data-duration="2.7"><span id="cap4-t">Rivals quit in seconds.</span></div>
    <div id="fact" class="clip" data-start="12.3" data-duration="2.7">
      <span id="fact-num">1,200+</span>

      <span id="fact-note">in some hummingbird species</span>
      <span id="fact-end">Every flower counts.</span>

  <script>
    const tl = gsap.timeline({ paused: true });
    const caps = [
      ["#cap1-t", 0.3, 3.0],
      ["#cap2-t", 3.4, 6.1],
      ["#cap3-t", 6.4, 9.1],
      ["#cap4-t", 9.4, 12.1],
    ];
    for (const [sel, s, e] of caps) {
      tl.fromTo(sel, { opacity: 0, y: 40, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "back.out(1.8)" }, s);
      tl.to(sel, { opacity: 0, y: -20, duration: 0.25, ease: "power2.in" }, e - 0.3);
    }
    const counter = { v: 0 };
    tl.fromTo("#fact-num", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 12.3);
    tl.fromTo(
      counter,
      { v: 0 },
      {
        v: 1200,
        duration: 0.9,
        ease: "power3.out",
        onUpdate: () => {
          document.getElementById("fact-num").textContent =
            Math.round(counter.v).toLocaleString("en-US") + (counter.v >= 1199.5 ? "+" : "");
        },
      },
      12.3,
    );
    tl.fromTo("#fact-unit", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 12.7);
    tl.fromTo("#fact-note", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 13.0);
    tl.fromTo("#fact-end", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, 13.6);
    window.__timelines["captions"] = tl;
