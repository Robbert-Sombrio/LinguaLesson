<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinguaLesson — Teacher Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,900;1,400&display=swap" rel="stylesheet">
  <style>
    /* ── Reset & base ─────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      line-height: 1.6;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* ── Screen top bar ───────────────────────────────────────────────────── */
    .top-bar {
      position: sticky; top: 0;
      background: #1e3a5f; color: #fff;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 24px; z-index: 100; gap: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,.2);
    }
    .brand { font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #7dd3fc; }
    .badge-teacher { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
      background: #0ea5e9; color: #fff; padding: 3px 10px; border-radius: 20px; }
    .top-actions { display: flex; gap: 8px; }
    .btn { border: none; cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 700;
      font-size: 12px; border-radius: 10px; padding: 8px 16px; display: inline-flex;
      align-items: center; gap: 6px; transition: opacity .15s; }
    .btn:hover { opacity: .85; }
    .btn-pdf { background: #fff; color: #1e3a5f; }
    .btn-md  { background: rgba(255,255,255,.15); color: #fff; }

    /* ── Page layout ──────────────────────────────────────────────────────── */
    .container { max-width: 800px; margin: 0 auto; padding: 40px 28px 80px; }

    /* ── Title block ──────────────────────────────────────────────────────── */
    .lesson-header { margin-bottom: 28px; }
    .lesson-meta   { font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .08em; color: #64748b; margin-bottom: 6px; }
    .lesson-title  { font-size: 26px; font-weight: 900; color: #0f172a; line-height: 1.2; margin-bottom: 6px; }
    .source-link   { font-size: 12px; color: #64748b; }
    .source-link a { color: #0369a1; text-decoration: underline; }

    /* ── Section cards ────────────────────────────────────────────────────── */
    .section {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 22px 24px;
      margin-bottom: 16px;
      break-inside: avoid;
    }
    .section-label {
      font-size: 10px; font-weight: 800; text-transform: uppercase;
      letter-spacing: .12em; color: #94a3b8; margin-bottom: 14px;
      display: flex; align-items: center; gap: 6px;
    }
    .section-label .emoji { font-size: 14px; }

    /* Reading starts on a new page when printing */
    .reading-section { break-before: page; }

    /* ── Quote ────────────────────────────────────────────────────────────── */
    .quote-block {
      border-left: 4px solid #1e3a5f;
      padding: 12px 18px;
      background: #f0f5ff;
      border-radius: 0 12px 12px 0;
    }
    .quote-text { font-size: 15px; font-style: italic; color: #1e293b; line-height: 1.65; }

    /* ── Numbered / bulleted lists ────────────────────────────────────────── */
    .q-list { list-style: none; counter-reset: qc; }
    .q-list li {
      counter-increment: qc;
      display: flex; gap: 10px;
      padding: 10px 0; border-bottom: 1px solid #f1f5f9;
      font-size: 14px; color: #334155; line-height: 1.6;
    }
    .q-list li:last-child { border-bottom: none; padding-bottom: 0; }
    .q-list li::before {
      content: counter(qc) ".";
      font-weight: 800; color: #1e3a5f;
      flex-shrink: 0; min-width: 22px; font-size: 13px;
    }

    /* ── Vocabulary table ─────────────────────────────────────────────────── */
    .vocab-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .vocab-table th {
      text-align: left; padding: 8px 10px;
      font-size: 10px; font-weight: 800; text-transform: uppercase;
      letter-spacing: .08em; color: #64748b;
      border-bottom: 2px solid #e2e8f0;
    }
    .vocab-table td { padding: 9px 10px; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
    .vocab-table tr:last-child td { border-bottom: none; }
    .vocab-word { font-weight: 800; color: #1e3a5f; font-size: 14px; }
    .vocab-pron { font-family: monospace; font-weight: 600; color: #0369a1; font-size: 11px;
      letter-spacing: .04em; white-space: nowrap; }
    .vocab-def  { color: #475569; line-height: 1.5; }

    /* ── Reading ──────────────────────────────────────────────────────────── */
    .reading-body p { margin-bottom: 14px; font-size: 15px; line-height: 1.8; color: #334155; }
    .reading-body p:last-child { margin-bottom: 0; }

    /* ── Vocab exercise ───────────────────────────────────────────────────── */
    .ex-list { list-style: none; counter-reset: ex; }
    .ex-list li {
      counter-increment: ex;
      display: flex; gap: 10px;
      padding: 9px 0; border-bottom: 1px solid #f1f5f9;
      font-size: 13.5px; color: #334155; line-height: 1.6;
    }
    .ex-list li:last-child { border-bottom: none; }
    .ex-list li::before {
      content: counter(ex) ".";
      font-weight: 800; color: #1e3a5f; flex-shrink: 0; min-width: 22px; font-size: 13px;
    }
    .ex-blank {
      display: inline-block;
      border-bottom: 2px solid #94a3b8;
      min-width: 70px; height: 1.1em;
      vertical-align: bottom; margin: 0 3px;
    }
    .ex-answer { font-size: 10px; color: #94a3b8; font-style: italic; margin-left: 6px; }

    /* ── Word bank (vocab exercise) ───────────────────────────────────────── */
    .word-bank {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start;
      background: #f8fafc; border: 1px solid #e2e8f0;
      border-radius: 12px; padding: 12px 14px; margin-bottom: 14px;
    }
    .word-bank-label {
      width: 100%; font-size: 9px; font-weight: 800; text-transform: uppercase;
      letter-spacing: .1em; color: #94a3b8; margin-bottom: 4px;
    }
    .word-chip {
      font-size: 12px; font-weight: 700;
      padding: 3px 12px; border-radius: 20px; border: 1px solid;
    }

    /* ── Grammar ──────────────────────────────────────────────────────────── */
    .grammar-title { font-size: 17px; font-weight: 900; color: #1e3a5f; margin-bottom: 8px; }
    .grammar-exp   { font-size: 14px; color: #334155; line-height: 1.7; margin-bottom: 14px; }
    .grammar-examples {
      background: #f0f9ff; border: 1px solid #bae6fd;
      border-radius: 12px; padding: 14px 18px; margin-bottom: 12px;
    }
    .grammar-examples p { font-size: 13px; color: #0369a1; font-style: italic;
      line-height: 1.6; margin-bottom: 6px; }
    .grammar-examples p:last-child { margin-bottom: 0; }
    .grammar-activity {
      background: #fffbeb; border: 1px solid #fde68a;
      border-radius: 12px; padding: 12px 16px;
      font-size: 13px; color: #78350f; line-height: 1.6;
    }
    .grammar-activity strong { font-weight: 800; display: block; margin-bottom: 4px; }

    /* ── Critical thinking / writing ─────────────────────────────────────── */
    .challenge-box {
      background: #f5f3ff; border: 1px solid #ddd6fe;
      border-radius: 12px; padding: 16px 20px;
      font-size: 14px; color: #4c1d95; line-height: 1.7;
    }
    .essay-box {
      background: #f0fdf4; border: 1px solid #bbf7d0;
      border-radius: 12px; padding: 16px 20px;
    }
    .essay-label { font-size: 10px; font-weight: 800; text-transform: uppercase;
      letter-spacing: .08em; color: #15803d; margin-bottom: 6px; }
    .essay-text  { font-size: 14px; color: #166534; line-height: 1.7; }

    /* ── Role-play ────────────────────────────────────────────────────────── */
    .scenario-box {
      background: #f8fafc; border: 1px solid #e2e8f0;
      border-radius: 10px; padding: 12px 16px;
      font-size: 13px; color: #475569; line-height: 1.6; margin-bottom: 12px;
    }
    .roles-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .role-box { border-radius: 12px; padding: 14px 16px; }
    .role-box.a { background: #eff6ff; border: 1px solid #bfdbfe; }
    .role-box.b { background: #f0f5ff; border: 1px solid #c7d2fe; }
    .role-label { font-size: 10px; font-weight: 800; text-transform: uppercase;
      letter-spacing: .08em; margin-bottom: 6px; }
    .role-box.a .role-label { color: #1d4ed8; }
    .role-box.b .role-label { color: #4338ca; }
    .role-text { font-size: 13px; color: #334155; line-height: 1.55; }

    /* ── Dialogues ────────────────────────────────────────────────────────── */
    .dialogue-group { margin-bottom: 20px; }
    .dialogue-group:last-child { margin-bottom: 0; }
    .dialogue-num { font-size: 10px; font-weight: 800; text-transform: uppercase;
      letter-spacing: .08em; color: #94a3b8; margin-bottom: 10px; }
    .dialogue-line { display: flex; gap: 10px; margin-bottom: 8px; align-items: flex-start; }
    .dialogue-line.b { flex-direction: row-reverse; }
    .speaker-badge {
      width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 900; flex-shrink: 0;
    }
    .speaker-a { background: #dbeafe; color: #1e40af; }
    .speaker-b { background: #e0e7ff; color: #3730a3; }
    .speech-bubble {
      max-width: 85%; border-radius: 16px; padding: 9px 14px;
      font-size: 13.5px; color: #1e293b; line-height: 1.55;
    }
    .speech-a { background: #eff6ff; border: 1px solid #dbeafe; border-top-left-radius: 4px; }
    .speech-b { background: #eef2ff; border: 1px solid #e0e7ff; border-top-right-radius: 4px; }

    /* ── Did you know ─────────────────────────────────────────────────────── */
    .dyk-box {
      background: #fffbeb; border: 1px solid #fde68a;
      border-radius: 12px; padding: 16px 20px;
      font-size: 14px; color: #78350f; line-height: 1.7;
    }

    /* ── Footer ───────────────────────────────────────────────────────────── */
    .footer {
      text-align: center; font-size: 11px; color: #94a3b8;
      margin-top: 48px; padding-top: 20px; border-top: 1px solid #e2e8f0;
    }

    /* ── Error ────────────────────────────────────────────────────────────── */
    .error { padding: 80px 24px; text-align: center; color: #64748b; font-size: 14px; }

    /* ── Print styles ─────────────────────────────────────────────────────── */
    @page { margin: 18mm 18mm 20mm; }

    @media print {
      body { background: #fff; font-size: 12px; }
      .no-print { display: none !important; }
      .top-bar  { display: none !important; }
      .container { padding: 0; max-width: 100%; }

      /* Most sections stay together */
      .section { break-inside: avoid; box-shadow: none; border-color: #e2e8f0; }

      /* These long sections can break across pages */
      .reading-section  { break-before: page; break-inside: auto; }
      .reading-body p   { break-inside: avoid; }
      .vocab-section    { break-before: page; break-inside: auto; }
      .dialogue-section { break-before: page; break-inside: auto; }

      /* Roles grid: single column on print */
      .roles-grid { grid-template-columns: 1fr 1fr; }

      /* Dialogue bubbles compact on print */
      .speech-bubble { max-width: 80%; font-size: 12.5px; }
    }
  </style>
</head>
<body>
  <div id="root"><p class="error">Loading lesson…</p></div>

  <script>
    function esc(s) {
      return String(s || '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    }

    function paras(text) {
      return (text || '').split(/\n+/)
        .map(p => p.trim()).filter(Boolean)
        .map(p => `<p>${esc(p)}</p>`).join('')
    }

    function qList(items) {
      return '<ul class="q-list">' +
        (items || []).map(q => `<li>${esc(q)}</li>`).join('') +
        '</ul>'
    }

    function render(lesson, article) {
      const isTopicBased = article.url.startsWith('topic:')
      const sourceLink = !isTopicBased && article.url.startsWith('http')
        ? `<p class="source-link">Source: <a href="${esc(article.url)}" target="_blank">${esc(article.source.name)}</a></p>`
        : ''

      const now = new Date().toLocaleDateString('en-GB', {year:'numeric', month:'long', day:'numeric'})

      /* Vocabulary table */
      const vocabRows = (lesson.vocabulary || []).map(v => `
        <tr>
          <td><span class="vocab-word">${esc(v.word)}</span></td>
          <td><span class="vocab-pron">${esc(v.pronunciation)}</span></td>
          <td class="vocab-def">${esc(v.definition)}</td>
        </tr>`).join('')

      /* Vocabulary exercise — shuffled word bank, no answers shown */
      const chipColors = [
        {bg:'#e0f2fe', color:'#0369a1', border:'#bae6fd'},
        {bg:'#e0e7ff', color:'#4338ca', border:'#c7d2fe'},
        {bg:'#f5f3ff', color:'#6d28d9', border:'#ddd6fe'},
        {bg:'#fef3c7', color:'#92400e', border:'#fde68a'},
      ]
      const shuffledWords = (lesson.vocabularyExercise || [])
        .map(ex => ex.answer)
        .sort(() => Math.random() - 0.5)
      const wordBankHtml =
        '<div class="word-bank"><span class="word-bank-label">Word Bank</span>' +
        shuffledWords.map((w, i) => {
          const c = chipColors[i % chipColors.length]
          return `<span class="word-chip" style="background:${c.bg};color:${c.color};border-color:${c.border}">${esc(w)}</span>`
        }).join('') +
        '</div>'

      const exItems = (lesson.vocabularyExercise || []).map(ex => {
        const parts = (ex.sentence || '').split('_____')
        const rendered = parts.map((p, i) =>
          i < parts.length - 1
            ? esc(p) + '<span class="ex-blank"></span>'
            : esc(p)
        ).join('')
        return `<li>${rendered}</li>`
      }).join('')

      /* Grammar examples */
      const grammarExs = (lesson.grammarPoint?.examples || [])
        .map(e => `<p>• ${esc(e)}</p>`).join('')

      /* Dialogues */
      const dialogueHtml = (lesson.dialogues || []).map((d, di) => {
        const lines = (d.lines || []).map(line => {
          const isA = line.speaker === 'A'
          const cleanText = (line.text || '').replace(/_{3,}/g, '')
          return `
            <div class="dialogue-line ${isA ? 'a' : 'b'}">
              <div class="speaker-badge ${isA ? 'speaker-a' : 'speaker-b'}">${esc(line.speaker)}</div>
              <div class="speech-bubble ${isA ? 'speech-a' : 'speech-b'}">${esc(cleanText)}</div>
            </div>`
        }).join('')
        return `
          <div class="dialogue-group">
            <p class="dialogue-num">Dialogue ${di + 1}</p>
            ${lines}
          </div>`
      }).join('')

      return `
        <div class="top-bar no-print">
          <div style="display:flex;align-items:center;gap:10px">
            <span class="brand">🌍 LinguaLesson</span>
            <span class="badge-teacher">Teacher Edition</span>
          </div>
          <div class="top-actions">
            <button class="btn btn-md" onclick="downloadMarkdown()">⬇ Markdown</button>
            <button class="btn btn-pdf" onclick="window.print()">🖨 Save as PDF</button>
          </div>
        </div>

        <div class="container">

          <!-- Title block -->
          <div class="lesson-header">
            <p class="lesson-meta">🎓 Teacher Lesson · ${esc(article.source.name)} · ${now}</p>
            <h1 class="lesson-title">${esc(lesson.title)}</h1>
            ${sourceLink}
          </div>

          <!-- 1. Warm-up Questions -->
          <div class="section">
            <p class="section-label"><span class="emoji">🔥</span> Warm-up Questions</p>
            ${qList(lesson.warmupQuestions)}
          </div>

          <!-- 2. Interesting Quote -->
          <div class="section">
            <p class="section-label"><span class="emoji">💡</span> Interesting Quote</p>
            <div class="quote-block">
              <p class="quote-text">"${esc(lesson.interestingQuote)}"</p>
            </div>
          </div>

          <!-- 3. Vocabulary -->
          <div class="section vocab-section">
            <p class="section-label"><span class="emoji">📚</span> Vocabulary — ${(lesson.vocabulary||[]).length} words</p>
            <table class="vocab-table">
              <thead>
                <tr>
                  <th>Word</th>
                  <th>Pronunciation</th>
                  <th>Definition</th>
                </tr>
              </thead>
              <tbody>${vocabRows}</tbody>
            </table>
          </div>

          <!-- 4. Reading -->
          <div class="section reading-section">
            <p class="section-label"><span class="emoji">📖</span> Reading</p>
            <div class="reading-body">${paras(lesson.reading)}</div>
          </div>

          <!-- 5. Comprehension Questions -->
          <div class="section">
            <p class="section-label"><span class="emoji">❓</span> Comprehension Questions</p>
            ${qList(lesson.comprehensionQuestions)}
          </div>

          <!-- 6. Vocabulary Exercise -->
          <div class="section">
            <p class="section-label"><span class="emoji">✏️</span> Vocabulary Exercise — complete each sentence</p>
            ${wordBankHtml}
            <ul class="ex-list">${exItems}</ul>
          </div>

          <!-- 7. Grammar Point -->
          <div class="section">
            <p class="section-label"><span class="emoji">⚙️</span> Grammar Point</p>
            <p class="grammar-title">${esc(lesson.grammarPoint?.title)}</p>
            <p class="grammar-exp">${esc(lesson.grammarPoint?.explanation)}</p>
            ${grammarExs ? `<div class="grammar-examples">${grammarExs}</div>` : ''}
            <div class="grammar-activity">
              <strong>📋 Activity</strong>${esc(lesson.grammarPoint?.activity)}
            </div>
          </div>

          <!-- 8. Discussion Questions -->
          <div class="section">
            <p class="section-label"><span class="emoji">💬</span> Discussion Questions</p>
            ${qList(lesson.discussionQuestions)}
          </div>

          <!-- 9. Critical Thinking -->
          <div class="section">
            <p class="section-label"><span class="emoji">🧠</span> Critical Thinking</p>
            <div class="challenge-box">${esc(lesson.criticalThinking)}</div>
          </div>

          <!-- 10. Writing Assignment -->
          <div class="section">
            <p class="section-label"><span class="emoji">📝</span> Writing Assignment</p>
            <div class="essay-box">
              <p class="essay-label">Essay Prompt</p>
              <p class="essay-text">${esc(lesson.writingAssignment)}</p>
            </div>
          </div>

          <!-- 11. Role-play Scenario -->
          <div class="section">
            <p class="section-label"><span class="emoji">🎭</span> Role-play Scenario</p>
            ${lesson.rolePlay?.scenario
              ? `<div class="scenario-box"><strong>Scenario:</strong> ${esc(lesson.rolePlay.scenario)}</div>`
              : ''}
            <div class="roles-grid">
              <div class="role-box a">
                <p class="role-label">Role A</p>
                <p class="role-text">${esc(lesson.rolePlay?.roleA)}</p>
              </div>
              <div class="role-box b">
                <p class="role-label">Role B</p>
                <p class="role-text">${esc(lesson.rolePlay?.roleB)}</p>
              </div>
            </div>
          </div>

          <!-- 12. Dialogue Practice -->
          <div class="section dialogue-section">
            <p class="section-label"><span class="emoji">🗣️</span> Dialogue Practice</p>
            ${dialogueHtml}
          </div>

          <!-- 13. Did You Know? -->
          <div class="section">
            <p class="section-label"><span class="emoji">🌍</span> Did You Know?</p>
            <div class="dyk-box">${esc(lesson.didYouKnow)}</div>
          </div>

          <p class="footer no-print">Generated with LinguaLesson Teacher Edition · ${now}</p>
          <p class="footer print-only" style="display:none">Generated with LinguaLesson Teacher Edition · ${now}</p>
        </div>`
    }

    /* ── Markdown export ───────────────────────────────────────────────── */
    function buildMarkdown(lesson, article) {
      const now = new Date().toLocaleDateString('en-GB', {year:'numeric', month:'long', day:'numeric'})
      const isTopicBased = article.url.startsWith('topic:')
      const sourceInfo = isTopicBased
        ? `**Topic:** ${article.title}`
        : `**Source:** [${article.source.name}](${article.url})`

      const numbered = (items) => (items || []).map((q, i) => `${i+1}. ${q}`).join('\n')

      const vocabTable = [
        '| Word | Pronunciation | Definition |',
        '|------|--------------|------------|',
        ...(lesson.vocabulary || []).map(v =>
          `| **${v.word}** | \`${v.pronunciation}\` | ${v.definition} |`)
      ].join('\n')

      const vocabAnswersShuffled = (lesson.vocabularyExercise || [])
        .map(ex => ex.answer)
        .sort(() => Math.random() - 0.5)
      const vocabWordBank = '**Word Bank:** ' + vocabAnswersShuffled.map(w => '`' + w + '`').join('  ·  ')
      const vocabEx = vocabWordBank + '\n\n' +
        (lesson.vocabularyExercise || [])
          .map((ex, i) => `${i+1}. ${ex.sentence.replace(/_____/g,'______')}`)
          .join('\n\n')

      const grammarExamples = (lesson.grammarPoint?.examples || [])
        .map(e => `- ${e}`).join('\n')

      const dialogues = (lesson.dialogues || []).map((d, di) => {
        const lines = (d.lines || [])
          .map(l => `**${l.speaker}:** ${(l.text || '').replace(/_{3,}/g, '')}`)
          .join('\n\n')
        return `### Dialogue ${di + 1}\n\n${lines}`
      }).join('\n\n---\n\n')

      return `# ${lesson.title}

${sourceInfo}
📅 ${now}

---

## 🔥 Warm-up Questions

${numbered(lesson.warmupQuestions)}

---

## 💡 Interesting Quote

> "${lesson.interestingQuote}"

---

## 📚 Vocabulary

${vocabTable}

---

## 📖 Reading

${(lesson.reading || '').split(/\n+/).map(p => p.trim()).filter(Boolean).join('\n\n')}

---

## ❓ Comprehension Questions

${numbered(lesson.comprehensionQuestions)}

---

## ✏️ Vocabulary Exercise

    function downloadMarkdown() {
      const data = window.__lessonData
      if (!data) return
      const md   = buildMarkdown(data.lesson, data.article)
      const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' })
      const url  = URL.createObjectURL(blob)
      const slug = (data.lesson.title || 'lesson').replace(/[^a-z0-9]+/gi, '-').toLowerCase().slice(0, 60)
      const a    = document.createElement('a')
      a.href     = url
      a.download = `lingualesson-${slug}.md`
      a.click()
      setTimeout(() => URL.revokeObjectURL(url), 5000)
    }

    /* ── Load from storage ─────────────────────────────────────────────────── */
    function showError(msg) {
      document.getElementById('root').innerHTML =
        `<p class="error">${esc(msg)}</p>`
    }

    try {
      if (typeof chrome === 'undefined' || !chrome.storage || !chrome.storage.local) {
        showError('Chrome extension APIs unavailable. Please open this page from the LinguaLesson side panel.')
      } else {
        chrome.storage.local.get(['teacherLessonExport'], function(result) {
          if (chrome.runtime.lastError) {
            showError('Storage error: ' + chrome.runtime.lastError.message)
            return
          }
          const data = result.teacherLessonExport
          if (!data || !data.lesson) {
            showError('No teacher lesson found. Please go back to the extension and generate a lesson first.')
            return
          }
          try {
            window.__lessonData = data
            document.title = (data.lesson.title || 'Teacher Lesson') + ' — LinguaLesson'
            document.getElementById('root').innerHTML = render(data.lesson, data.article)

            if (new URLSearchParams(location.search).get('print') === '1') {
              setTimeout(() => window.print(), 900)
            }
          } catch (renderErr) {
            showError('Error rendering lesson: ' + (renderErr.message || renderErr))
          }
        })
      }
    } catch (err) {
      showError('Failed to load lesson: ' + (err.message || err))
    }
  </script>
