<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #eeeae1; }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="39.45" data-width="1080" data-height="1920">
      <div id="frame" data-composition-id="frame" data-composition-src="compositions/frame.html" data-start="0" data-duration="39.45"
        data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="headline" data-composition-id="headline" data-composition-src="compositions/headline.html" data-start="0" data-duration="8.3"
        data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="versus" data-composition-id="versus" data-composition-src="compositions/versus.html" data-start="8.3" data-duration="8.75"
        data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="interview" data-composition-id="interview" data-composition-src="compositions/interview.html" data-start="17.05" data-duration="4.15"
        data-track-index="4" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="stress" data-composition-id="stress" data-composition-src="compositions/stress.html" data-start="21.2" data-duration="6.22"
        data-track-index="5" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="27.42" data-duration="12.03"
        data-track-index="6" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 3" data-variable-values='{"link": "Link in the description", "foot": "@fluentedgepodcast"}'></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="39.45"
        data-track-index="7" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index: 4"></div>
      <audio id="voice" class="clip" src="assets/audio/voice-youtube.wav" data-start="0" data-duration="38.25" data-track-index="10" data-volume="1.15"></audio>
      <audio id="bed" class="clip" src="assets/audio/bed-youtube.wav" data-start="0" data-duration="39.45" data-track-index="11" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
