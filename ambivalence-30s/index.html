<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root { --paper: #eeeae1; --ink: #2e3642; --red: #e2483f; --blue: #4e6388; --sky: #b8cce2; --gold: #e3a728; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <div id="frame" data-composition-id="frame" data-composition-src="compositions/frame.html" data-start="0" data-duration="30.0"
        data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="5.55"
        data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="sayit" data-composition-id="sayit" data-composition-src="compositions/sayit.html" data-start="5.55" data-duration="3.4"
        data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="word" data-composition-id="word" data-composition-src="compositions/word.html" data-start="8.95" data-duration="3.9"
        data-track-index="4" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="context" data-composition-id="context" data-composition-src="compositions/context.html" data-start="12.85" data-duration="6.55"
        data-track-index="5" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="work" data-composition-id="work" data-composition-src="compositions/work.html" data-start="19.4" data-duration="8.2"
        data-track-index="6" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="27.6" data-duration="2.4"
        data-track-index="7" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="30.0"
        data-track-index="8" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index: 4"></div>
      <audio id="voice" class="clip" src="assets/audio/voice-final.wav" data-start="0" data-duration="27.15" data-track-index="10" data-volume="1.15"></audio>
      <audio id="bed" class="clip" src="assets/audio/bed.wav" data-start="0" data-duration="30" data-track-index="11" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
